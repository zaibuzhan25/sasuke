<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>群友缸 · Physics Jar</title>
<link rel="icon" type="image/svg+xml" href="images/logo.svg">
<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<style>
  :root{
    --bg:#0a0a0a;
    --text:#f5f5f5;
    --muted:#8a8a8a;
    --accent:#ff2a2a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    background:radial-gradient(ellipse at 50% 0%,#161616,#0a0a0a 70%);
    color:var(--text);
    font-family:"Inter","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100vh;
    overflow:hidden;
  }
  header{
    position:fixed;top:0;left:0;right:0;z-index:10;
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 40px;pointer-events:none;
  }
  .title{font-weight:900;letter-spacing:4px;font-size:20px}
  .title span{color:var(--accent)}
  .tip{color:var(--muted);font-size:13px;letter-spacing:1px}
  #stage{position:fixed;inset:0;}
  .btn-row{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:10;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:12px;max-width:calc(100vw - 24px)}
  button{
    background:transparent;color:var(--text);
    border:1px solid rgba(255,255,255,0.2);border-radius:999px;
    padding:11px 24px;font-size:14px;letter-spacing:1px;cursor:pointer;white-space:nowrap;
    flex:0 0 auto;min-width:0;
    transition:all .3s;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:700px){ header{padding:16px 18px} .title{font-size:17px;letter-spacing:2px} .tip{display:none} .btn-row{gap:10px} button{padding:10px 20px;font-size:13px} }
  @media(max-width:380px){ .btn-row{gap:8px} button{padding:10px 14px;font-size:12px;letter-spacing:0} }
</style>
</head>
<body>
  <header>
    <div class="title">群友缸<span>.</span></div>
    <div class="tip">拖拽群友 · 晃动碰撞 · 真实物理</div>
  </header>

  <div id="stage"></div>

  <div class="btn-row">
    <button id="shakeBtn">摇一摇</button>
    <button id="resetBtn">重新装缸</button>
  </div>

  <!-- 成员数据 + 物理逻辑 -->
  <script src="js/members.js"></script>
  <script src="js/jar.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <!-- 写轮眼：眼白轮廓 -->
  <!-- 红色虹膜 -->
  <circle cx="32" cy="32" r="22" fill="#e21b1b"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ff5a5a" stroke-width="1.5"/>
  <!-- 三个勾玉 -->
  <g fill="#0a0a0a">
    <circle cx="32" cy="17" r="4.2"/>
    <circle cx="45" cy="39.5" r="4.2"/>
    <circle cx="19" cy="39.5" r="4.2"/>
  </g>
  <!-- 黑色瞳孔 -->
  <circle cx="32" cy="32" r="7.5" fill="#0a0a0a"/>
  <!-- 高光 -->
  <circle cx="26" cy="25" r="2.4" fill="#ffb0b0" opacity="0.8"/>
</svg>
